  Open this file in Chrome with ?clean=1, set the screen recorder to the exact
  1920x1080 canvas region, and record at 60fps. The animation settles at 3.2s;
  the renderer captures 4.0s to include a short hold.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Telora Logo Sting</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f5f3ed;
        --text: #18322b;
        --text-muted: #6d756f;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
        overflow: auto;
        background: #111113;
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .canvas {
        display: grid;
        width: 1920px;
        height: 1080px;
        place-items: start center;
        overflow: hidden;
        background: radial-gradient(circle at 50% 46%, #f7f5f0 0%, var(--bg) 48%, #f1efe8 100%);
      }

      .lockup {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 79px;
        margin-top: 268px;
      }

      .logo {
        width: 1040px;
        height: auto;
        overflow: visible;
      }

      #mark {
        animation: mark-in 1.2s var(--ease) both;
        transform-box: fill-box;
        transform-origin: center;
      }

      #wordmark {
        animation: wordmark-in 1s var(--ease) 1s both;
        clip-path: inset(0 100% 0 0);
      }

      .tagline {
        margin: 0;
        color: var(--text-muted);
        font-size: 52px;
        font-weight: 500;
        letter-spacing: 0.08em;
        line-height: 1.2;
        opacity: 0;
        animation: tagline-in 1s var(--ease) 2.2s both;
      }

      .replay {
        position: fixed;
        bottom: max(24px, calc((100vh - 1080px) / 2 + 24px));
        left: calc(50% + 960px + 24px);
        min-width: 96px;
        height: 42px;
        border: 1px solid rgb(245 243 237 / 18%);
        border-radius: 8px;
        background: rgb(251 250 247 / 92%);
        color: var(--text);
        cursor: pointer;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        box-shadow: 0 12px 32px rgb(0 0 0 / 24%);
        transition: background 160ms var(--ease), transform 160ms var(--ease);
      }

      .replay:hover {
        background: #ffffff;
        transform: translateY(-1px);
      }

      .replay:focus-visible {
        outline: 2px solid var(--text);
        outline-offset: 3px;
      }

      .clean .replay {
        display: none;
      }

      @keyframes mark-in {
        from {
          opacity: 0;
          transform: scale(0.92);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes wordmark-in {
        from {
          clip-path: inset(0 100% 0 0);
          transform: translateY(12px);
        }
        to {
          clip-path: inset(0 0 0 0);
          transform: translateY(0);
        }
      }

      @keyframes tagline-in {
        from {
          opacity: 0;
          letter-spacing: 0.3em;
        }
        to {
          opacity: 1;
          letter-spacing: 0.08em;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #mark,
        #wordmark,
        .tagline {
          animation: none;
          opacity: 1;
          transform: none;
        }

        #wordmark {
          clip-path: inset(0 0 0 0);
        }

        .tagline {
          letter-spacing: 0.08em;
        }
      }
    </style>
  </head>
  <body>
    <main class="canvas" aria-label="Telora logo sting canvas">
      <section class="lockup" aria-label="Telora">

          <title id="logo-title">Telora logo</title>

 2.29102,-0.298828 8.79883,-0.962891 9.79493,-2.125 v 5.146484 c 0,4.548829 -3.68555,8.998047 -10.29297,8.998047 z" />
          </g>
        </svg>
        <p class="tagline">Talent, tracked with clarity.</p>
      </section>
    </main>
    <button class="replay" type="button">Replay</button>
    <script>
      const params = new URLSearchParams(window.location.search);
      const clean = params.get("clean") === "1";
      const replay = document.querySelector(".replay");

      if (clean) {
        document.documentElement.classList.add("clean");
      }

      replay.addEventListener("click", () => {
        const canvas = document.querySelector(".canvas");
        canvas.style.animation = "none";
        canvas.offsetHeight;
        canvas.style.animation = "";
        document.querySelectorAll("#mark, #wordmark, .tagline").forEach((element) => {
          element.style.animation = "none";
          element.offsetHeight;
          element.style.animation = "";
        });
      });
    </script>
  </body>
</html>
